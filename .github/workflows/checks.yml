# Basic checks. Runs only what applies to the project (Python and/or JavaScript).
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project type
        id: detect
        run: |
          echo "python=$( [ -n "$(git ls-files '*.py' | grep -v '^\.claude/' | grep -v '^scripts/')" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "node=$( [ -f package.json ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.python == 'true'
        with:
          python-version: "3.12"
      - name: Python checks
        if: steps.detect.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          pip install pytest ruff
          ruff check .
          if ls tests/*.py >/dev/null 2>&1; then pytest; else echo "No Python tests yet."; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: "20"
      - name: JavaScript checks
        if: steps.detect.outputs.node == 'true'
        run: |
          npm ci || npm install
          npm test --if-present
      - name: Secret pattern check
        run: |
          if git ls-files | grep -Ev '^(docs/ai-log/|\.github/)' | xargs -r grep -nEI '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|password\s*=\s*["'"'"'][^"'"'"']+["'"'"']|api[_-]?key\s*=\s*["'"'"'][^"'"'"']+["'"'"'])'; then
            echo "::error::Possible secret found. Remove it and use an environment variable."
            exit 1
          fi
          echo "No obvious secrets found."
